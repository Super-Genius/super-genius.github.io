name: Build GCS JEPA WIP paper (wip branch only)

on:
  push:
    branches:
      - wip
    paths:
      - '.github/workflows/build-gcs-jepa-wip.yml'
      - 'papers/wip/.draft-tex.part*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wip-paper:
    if: github.ref == 'refs/heads/wip'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wip only
        uses: actions/checkout@v4
        with:
          ref: wip
          persist-credentials: true
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-pictures texlive-fonts-recommended lmodern
      - name: Restore exact LaTeX source and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          cat papers/wip/.draft-tex.part1 papers/wip/.draft-tex.part2 papers/wip/.draft-tex.part3 | base64 --decode > /tmp/gcs-paper.tex.gz
          echo 'b7d682d4f04feaecb632340e4bf6fbce3b0d7d88f92bdfa5ce5e526dc81c3bdd  /tmp/gcs-paper.tex.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/gcs-paper.tex.gz > papers/wip/GCS-Specialist-Hybrid-JEPA-Working-Paper.tex
          test -s papers/wip/GCS-Specialist-Hybrid-JEPA-Working-Paper.tex
      - name: Compile review PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gcs-paper-build
          latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=/tmp/gcs-paper-build papers/wip/GCS-Specialist-Hybrid-JEPA-Working-Paper.tex
          cp /tmp/gcs-paper-build/GCS-Specialist-Hybrid-JEPA-Working-Paper.pdf papers/wip/GCS-Specialist-Hybrid-JEPA-Working-Paper.pdf
          test -s papers/wip/GCS-Specialist-Hybrid-JEPA-Working-Paper.pdf
      - name: Commit draft files to wip only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = wip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/wip/GCS-Specialist-Hybrid-JEPA-Working-Paper.tex papers/wip/GCS-Specialist-Hybrid-JEPA-Working-Paper.pdf
          git rm -- papers/wip/.draft-tex.part1 papers/wip/.draft-tex.part2 papers/wip/.draft-tex.part3
          git commit -m "Add GCS specialist-hybrid JEPA working paper source and PDF on wip"
          git push origin HEAD:wip
